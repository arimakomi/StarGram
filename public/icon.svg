<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>
  <!-- Crisp white rounded squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#ffffff" filter="url(#softShadow)"/>
  
  <!-- Centered Minimal StarChat Icon -->
  <image href="/icon-512.png" x="0" y="0" width="512" height="512" clip-path="url(#squircleClip)" />
</svg>
