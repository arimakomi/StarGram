<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Starly Chat | چت استارلی</title>
  <meta name="description" content="A high-performance, Telegram-inspired messenger featuring username-based authentication and a built-in AI assistant powered by Gemini.">
  <meta property="og:title" content="Starly Chat | چت استارلی">
  <meta property="og:description" content="A high-performance, Telegram-inspired messenger featuring username-based authentication and a built-in AI assistant powered by Gemini.">
  
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0e1621">
  <script>
    window.stargramInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.stargramInstallPrompt = event;
      window.dispatchEvent(new Event('stargram:installprompt'));
    });
    window.addEventListener('appinstalled', () => {
      window.stargramInstallPrompt = null;
    });
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StarChat">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
    
    :root {
      --tg-bg: #0e1621;
      --tg-secondary: #17212b;
      --tg-accent: #3390ec;
      --tg-text: #ffffff;
      --tg-text-secondary: #708499;
      --tg-input: #242f3d;
      --chat-font-size: 15px;
      --message-bubble-radius: 1rem;
    }

    body { 
      font-family: 'Vazirmatn', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, Arial, sans-serif; 
      margin: 0; 
      overflow: hidden; 
      background-color: var(--tg-bg);
      color: var(--tg-text);
      user-select: none;
    }

    /* Classic Telegram Light (Day Theme) */
    .day-theme { 
      --tg-bg: #e4ecf2; 
      --tg-secondary: #ffffff; 
      --tg-accent: #3390ec;
      --tg-text: #111827;
      --tg-text-secondary: #64748b;
      --tg-input: #f1f5f9;
      background-color: #e4ecf2 !important;
      color: #111827 !important;
    }

    /* 1. Base Surfaces */
    .day-theme [class*="bg-[#0e1621]"] {
      background-color: #e4ecf2 !important;
    }
    .day-theme [class*="bg-[#17212b]"]:not([class*="bg-[#3390ec]"]) {
      background-color: #ffffff !important;
    }
    .day-theme [class*="bg-[#242f3d]"]:not([class*="bg-[#3390ec]"]) {
      background-color: #f1f5f9 !important;
    }
    .day-theme [class*="bg-[#1e2c3a]"],
    .day-theme [class*="bg-[#2b3949]"],
    .day-theme [class*="bg-[#2b3a4a]"],
    .day-theme [class*="bg-[#1e2a38]"],
    .day-theme [class*="bg-[#1c2733]"],
    .day-theme [class*="bg-[#1b2531]"] {
      background-color: #f8fafc !important;
    }

    /* Subdued cards and hover backgrounds */
    .day-theme [class*="bg-white/5"] {
      background-color: rgba(15, 23, 42, 0.04) !important;
    }
    .day-theme [class*="bg-white/10"] {
      background-color: rgba(15, 23, 42, 0.08) !important;
    }
    .day-theme [class*="hover:bg-white/5"]:hover {
      background-color: rgba(15, 23, 42, 0.05) !important;
    }
    .day-theme [class*="hover:bg-white/10"]:hover {
      background-color: rgba(15, 23, 42, 0.09) !important;
    }
    .day-theme [class*="hover:bg-[#242f3d]"]:hover {
      background-color: #f1f5f9 !important;
    }

    /* 2. Text Legibility - Non-destructive */
    .day-theme p,
    .day-theme span,
    .day-theme h1,
    .day-theme h2,
    .day-theme h3,
    .day-theme h4 {
      color: inherit;
    }
    .day-theme .text-white:not([class*="bg-[#3390ec]"] *):not([class*="bg-red-"] *):not([class*="bg-green-"] *):not([class*="bg-emerald-"] *):not([class*="bg-blue-"] *):not([class*="bg-[#2881d9]"] *) {
      color: #111827 !important;
    }
    .day-theme [class*="text-[#708499]"] {
      color: #64748b !important;
    }

    /* 3. CRITICAL: Crisp Pure White Text on Accent Buttons and Active Chat Rows! */
    .day-theme [class*="bg-[#3390ec]"],
    .day-theme [class*="bg-[#3390ec]"] *,
    .day-theme [class*="bg-[#2881d9]"],
    .day-theme [class*="bg-[#2881d9]"] *,
    .day-theme [class*="bg-red-500"],
    .day-theme [class*="bg-red-500"] *,
    .day-theme [class*="bg-red-600"] *,
    .day-theme [class*="bg-green-500"] *,
    .day-theme [class*="bg-emerald-500"] * {
      color: #ffffff !important;
    }

    /* Unread badge inside active chat row */
    .day-theme [class*="bg-[#3390ec]"] .bg-white,
    .day-theme [class*="bg-[#3390ec]"] .bg-white * {
      background-color: #ffffff !important;
      color: #3390ec !important;
    }

    /* 4. Telegram Light Message Bubbles */
    /* Sent messages: Classic Telegram soft green */
    .day-theme .message-bubble.bubble-sent,
    .day-theme .message-bubble[class*="bg-[#2b5278]"] {
      background-color: #eeffde !important;
      color: #111827 !important;
      border: 1px solid #d4f0be !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05) !important;
    }
    .day-theme .message-bubble.bubble-sent *,
    .day-theme .message-bubble[class*="bg-[#2b5278]"] * {
      color: #111827 !important;
    }
    .day-theme .message-bubble.bubble-sent .bubble-meta,
    .day-theme .message-bubble[class*="bg-[#2b5278]"] .bubble-meta,
    .day-theme .message-bubble.bubble-sent .bubble-meta *,
    .day-theme .message-bubble[class*="bg-[#2b5278]"] .bubble-meta * {
      color: #4fae4e !important;
    }
    .day-theme .message-tail-sent {
      color: #eeffde !important;
    }

    /* Received messages: Pure crisp white */
    .day-theme .message-bubble.bubble-received,
    .day-theme .message-bubble[class*="bg-[#182533]"] {
      background-color: #ffffff !important;
      color: #111827 !important;
      border: 1px solid #e2e8f0 !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06) !important;
    }
    .day-theme .message-bubble.bubble-received *,
    .day-theme .message-bubble[class*="bg-[#182533]"] * {
      color: #111827 !important;
    }
    .day-theme .message-bubble.bubble-received .bubble-meta,
    .day-theme .message-bubble[class*="bg-[#182533]"] .bubble-meta,
    .day-theme .message-bubble.bubble-received .bubble-meta * {
      color: #707579 !important;
    }
    .day-theme .message-tail-received {
      color: #ffffff !important;
    }

    /* 5. Chat Wallpaper in Day Theme */
    .day-theme .chat-wallpaper {
      background-color: #e4ecf2 !important;
      background-image: radial-gradient(circle at 25px 25px, rgba(0, 0, 0, 0.04) 2%, transparent 0%), radial-gradient(circle at 75px 75px, rgba(0, 0, 0, 0.04) 2%, transparent 0%) !important;
      background-size: 100px 100px !important;
    }

    /* 6. Borders */
    .day-theme [class*="border-white/5"],
    .day-theme [class*="border-white/10"],
    .day-theme [class*="border-white/20"],
    .day-theme [class*="border-white"] {
      border-color: #e2e8f0 !important;
    }
    .day-theme [class*="border-black"] {
      border-color: #e2e8f0 !important;
    }

    /* 7. Inputs & Textareas */
    .day-theme input,
    .day-theme textarea {
      background-color: #f1f5f9 !important;
      color: #111827 !important;
      border-color: #cbd5e1 !important;
    }
    .day-theme input::placeholder,
    .day-theme textarea::placeholder {
      color: #94a3b8 !important;
    }

    /* 8. Modals & Backdrops */
    .day-theme .fixed.inset-0[class*="bg-black/80"],
    .day-theme .fixed.inset-0[class*="bg-black/60"],
    .day-theme .fixed.inset-0[class*="bg-black/50"],
    .day-theme .fixed.inset-0[class*="bg-black/40"] {
      background-color: rgba(15, 23, 42, 0.45) !important;
    }

    /* Scrollbars in Day Theme */
    .day-theme .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18) !important;
    }
    .day-theme .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3) !important;
    }
    
    .oled-theme { 
      --tg-bg: #000000; 
      --tg-secondary: #000000; 
      --tg-input: #121212;
      border-color: #1a1a1a !important;
    }

    .oled-theme [class*="bg-[#0e1621]"],
    .oled-theme [class*="bg-[#17212b]"],
    .oled-theme [class*="bg-[#1e2c3a]"],
    .oled-theme [class*="bg-[#242f3d]"],
    .oled-theme [class*="bg-[#2b3949]"],
    .oled-theme [class*="bg-[#182533]"] {
      background-color: #000000 !important;
    }

    .arctic-theme {
      --tg-bg: #0b141a;
      --tg-secondary: #111b21;
      --tg-accent: #00a884;
      --tg-text: #e9edef;
      --tg-text-secondary: #8696a0;
      --tg-input: #202c33;
    }

    .arctic-theme [class*="bg-[#0e1621]"] { background-color: var(--tg-bg) !important; }
    .arctic-theme [class*="bg-[#17212b]"],
    .arctic-theme [class*="bg-[#182533]"] { background-color: var(--tg-secondary) !important; }
    .arctic-theme [class*="bg-[#242f3d]"] { background-color: #202c33 !important; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Telegram Web A Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .message-bubble {
      max-width: 100%;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: var(--message-bubble-radius) !important;
    }

    .message-bubble.rounded-tr-none { border-top-right-radius: 0 !important; }
    .message-bubble.rounded-tl-none { border-top-left-radius: 0 !important; }
    .chat-message-text { font-size: var(--chat-font-size); }
    
    .chat-wallpaper {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
      background-color: var(--tg-bg);
    }

    /* Telegram Web A Spring Animations */
    @keyframes springSlideUp {
      0% {
        transform: translateY(14px) scale(0.96);
        opacity: 0;
      }
      60% {
        transform: translateY(-2px) scale(1.01);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
    .animate-msg {
      animation: springSlideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes soundWave {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }
    .wave-bar {
      animation: soundWave 0.9s ease-in-out infinite alternate;
    }

    /* Mentions styling */
    .mention-tag {
      color: #3390ec;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      padding: 0 2px;
      transition: background-color 0.15s ease;
    }
    .mention-tag:hover {
      background-color: rgba(51, 144, 236, 0.15);
      text-decoration: underline;
    }

    input, textarea { user-select: text; }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",

    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",

  }
}
</script>
</head>
<body class="night-theme">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.log('SW registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
